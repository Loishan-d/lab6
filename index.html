
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hua Chenyu | Album Collection</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav class="navbar md:navbar-expand bg-1 fg-2">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    Hua Chenyu
                </a>

                <button class="btn-icon navbar-toggler" type="button"
                    data-bs-toggle="drawer"
                    data-bs-target="#navbarMenu"
                    aria-controls="navbarMenu"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>

                <dialog class="drawer drawer-end" tabindex="-1"
                    id="navbarMenu" aria-labelledby="navbarMenuLabel">
                    <div class="drawer-header">
                        <h2 class="drawer-title" id="navbarMenuLabel">Menu</h2>
                        <button type="button" class="btn-close"
                            data-bs-dismiss="drawer" aria-label="Close"></button>
                    </div>

                    <div class="drawer-body">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page"
                                    href="index.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#albums">Albums</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="contact.html">Contact</a>
                            </li>
                        </ul>
                    </div>

                </dialog>
            </div>
        </nav>
    </header>

   
<main class="container mt-4">

    <h1 class="text-center">Hua Chenyu Album Collection</h1>
    <p class="text-center">
        Explore the music and creative journey of Hua Chenyu.
    </p>

    <!-- Carousel -->
    <section class="mt-4">

        <div id="albumCarousel" class="carousel carousel-overlay">

            <div class="carousel-inner rounded-5">

                <div class="carousel-item active">
                    <img src="images/banner1.jpg" class="d-block w-100"
                        alt="Hua Chenyu in a promotional portrait">
                </div>

                <div class="carousel-item">
                    <img src="images/banner2.jpg" class="d-block w-100"
                        alt="Promotional artwork for a Hua Chenyu album">
                </div>

                <div class="carousel-item">
                    <img src="images/banner3.jpg" class="d-block w-100"
                        alt="Scene from a Hua Chenyu music video">
                </div>

            </div>

            <div class="carousel-overlay-controls">

                <button class="btn-icon btn-sm btn-subtle theme-secondary"
                    type="button"
                    data-bs-target="#albumCarousel"
                    data-bs-slide="prev">
                    <span class="carousel-icon-prev" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>

                <button class="btn-icon btn-sm btn-subtle theme-secondary"
                    type="button"
                    data-bs-target="#albumCarousel"
                    data-bs-slide="next">
                    <span class="carousel-icon-next" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>

            </div>

        </div>

    </section>

</main>


    <script type="module" src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
